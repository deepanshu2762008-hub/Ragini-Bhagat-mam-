<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F4EEE3" />

    <!-- SEO defaults; the data file (src/data/portfolio.ts) re-writes these at runtime -->
    <title>Ragini Bhagat — Educator • Mentor • Lifelong Learner</title>

      name="description"
      content="The professional journey of Ragini Bhagat, educator: a digital sketchbook of teaching philosophy, classroom work, achievements and the road ahead."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Ragini Bhagat — Educator • Mentor • Lifelong Learner" />

      property="og:description"
      content="A digital sketchbook documenting a teacher's professional journey."
    />
    <meta property="og:image" content="/images/portrait.svg" />
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
