<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Ragini Bhagat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400&display=swap"
    />
    <style>
      :root {
        --paper: #f4eee3;
        --ink: #2b2721;
        --green: #4a5c40;
        --line: rgba(43, 39, 33, 0.15);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Newsreader', Georgia, serif;
        font-size: 18px;
        line-height: 1.6;
        text-align: center;
        padding: 24px;
      }
      .sheet {
        max-width: 34rem;
        padding: 56px 40px;
        background: #fbf8f2;
        border: 1px solid var(--line);
        box-shadow: 0 1px 2px rgba(43, 39, 33, 0.06), 0 16px 40px rgba(43, 39, 33, 0.08);
        transform: rotate(-0.6deg);
      }
      .num {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: clamp(4rem, 18vw, 7rem);
        line-height: 1;
        margin: 0;
        color: var(--green);
      }
      h1 {
        font-family: 'Instrument Serif', Georgia, serif;
        font-weight: 400;
        font-size: 30px;
        letter-spacing: 0.01em;
        margin: 16px 0 8px;
      }
      p {
        margin: 0 0 28px;
      }
      a {
        display: inline-block;
        min-height: 44px;
        line-height: 44px;
        padding: 0 26px;
        color: var(--paper);
        background: var(--ink);
        text-decoration: none;
        font-size: 16px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      a:hover {
        transform: translateY(-2px);
      }
      a:focus-visible {
        outline: 3px solid var(--green);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <p class="num" aria-hidden="true">404</p>
      <h1>This page isn't in the notebook</h1>
      <p>The page you were looking for has been moved, or never written.</p>
      <a href="/">Back to the cover</a>
    </main>
  </body>
</html>
